name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: smart_support_test
          POSTGRES_USER: smart_support
          POSTGRES_PASSWORD: smart_support_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_support -d smart_support_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      LLM_MODE: mock
      EMBEDDING_MODE: disabled
      DATABASE_URL: postgresql+psycopg://smart_support:smart_support_test@127.0.0.1:5432/smart_support_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
